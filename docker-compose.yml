services:
  zk-checkin:
    build: .
    container_name: zk-checkin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:3012"
    environment:
      PORT: "3012"
      HOST: "0.0.0.0"
      CONFIG_PATH: "/app/config.json"
      DATABASE_PATH: "/app/data/app.json"
      RECORDS_PATH: "/app/data/records.json"
      CONFIG_BACKUP_DIR: "/app/data/config-backups"
      CONFIG_BACKUP_LIMIT: "${CONFIG_BACKUP_LIMIT:-60}"
      RECORDS_BACKUP_ENABLED: "${RECORDS_BACKUP_ENABLED:-true}"
      RECORDS_BACKUP_DIR: "/app/data/record-backups"
      RECORDS_BACKUP_LIMIT: "${RECORDS_BACKUP_LIMIT:-120}"
      SESSION_SECRET: "${SESSION_SECRET:-please-change-this-to-a-long-random-string}"
      ABSENCE_ALERT_ENABLED: "${ABSENCE_ALERT_ENABLED:-false}"
      ABSENCE_ALERT_TO: "${ABSENCE_ALERT_TO:-}"
      ABSENCE_ALERT_DAYS: "${ABSENCE_ALERT_DAYS:-3}"
      ABSENCE_ALERT_HOUR: "${ABSENCE_ALERT_HOUR:-21}"
      ABSENCE_ALERT_TIMEZONE: "${ABSENCE_ALERT_TIMEZONE:-Asia/Shanghai}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data
      - ./Newtestament:/app/Newtestament:ro
      - ./Passage:/app/Passage:ro
      - ./PPT:/app/PPT:ro
      - ./Mentor:/app/Mentor:ro
